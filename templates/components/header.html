<header
  id="header"
  class="fixed left-0 right-0 z-50 bg-background text-foreground border-border border-b w-full transition-all duration-500"
>
  <nav class="max-w-6xl mx-auto flex flex-row justify-end md:justify-between items-center gap-2 px-6 py-4">
    <div class="hidden md:flex gap-1">
      <p>Developed by</p>
      <a
        href="https://github.com/maelacudini"
        target="_blank"
        rel="noopener noreferrer"
        class="link"
      >@maelacudini</a>
    </div>
    <div class="space-x-4">
      <a
        href="{% url "home" %}"
        class="link"
      >Home</a>
      <a
        href="#posts"
        class="link"
      >Posts</a>
      <a
        href="{% url "contact" %}"
        class="link"
      >Contact</a>
      <button
        id="theme-toggle"
        type="button"
        aria-pressed="false"
        onclick="toggleTheme()"
        aria-label="Toggle theme"
        class="link"
      >
        <span id="dark-span">Dark</span>
        <span id="light-span">Light</span>
      </button>
    </div>
  </nav>
</header>
