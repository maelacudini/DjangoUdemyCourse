{% extends "base.html" %}
{% load static %}

{% block page_title %}
  Post
{% endblock %}

{% block body_content %}
  <h1>Post</h1>
  <p>Welcome to the Post homepage.</p>
  <div class="flex gap-4">
    {% if post.categories.all %}
      {% for category in post.categories.all %}
        <span class="uppercase text-sm text-muted-foreground">{{ category.caption }}</span>
      {% endfor %}
    {% endif %}
  </div>
{% endblock %}
